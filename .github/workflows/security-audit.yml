name: Security & Hygiene

# ALICE-SDF v1.7.7 (commit 52d26f9) を base に ALICE-Cache 用に調整
#
# 目的:
# - RustSec advisory (CVE) の週次検知
# - dep license 逸脱の block (自 crate は deny.toml の [licenses.private] で除外)
# - 未使用依存の炙り出し
# - 仮実装 (panic!(STUB) / dbg!) の CI gate、todo!/unimplemented! は informational

on:
  push:
    branches: [main, 'ci/**']
  schedule:
    # 毎週月曜 09:00 UTC = 18:00 JST
    - cron: '0 9 * * 1'
  workflow_dispatch:

# on main each commit has a group of its own and a run there is never
# cancelled; a newer run on the same branch cancels an older one only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "5"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # which files changed: a new or force-pushed branch is compared with merge-base(origin/main),
  # another push with before..after, a pull request with base...head; schedule and manual
  # runs always run; any error runs (fail-closed) — scripts/changed_paths.py
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after || github.sha }}
          CREATED: ${{ github.event.created }}
          FORCED: ${{ github.event.forced }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/changed_paths.py decide --event "$EVENT"
          --before "$BEFORE" --after "$AFTER" --created "$CREATED" --forced "$FORCED"
          --base "$PR_BASE" --head "$PR_HEAD"
          --patterns-file .github/paths/security-audit.txt

  audit:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo audit (RustSec CVE scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # advisory-db は audit 実行時に自動取得 yanked crate は deny
      # paste unmaintained (pyo3-macros transitive)
      # RUSTSEC-2026-0176/0177: pyo3 CVE (surfaces via transitive) は現時点 pin 済で対応
      - name: Run cargo audit
        run: |
          cargo audit --deny yanked \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0192 \
            --ignore RUSTSEC-2026-0176 \
            --ignore RUSTSEC-2026-0177

  deny:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-deny (license + advisories + bans + sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # EmbarkStudios/cargo-deny-action@v2 は Docker container 内で稼働し、
      # /github/workspace のみ mount するため sibling path dep が見えず fail する
      # 直接 install で回避
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check all
        run: cargo deny --all-features check all

  unused-deps:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # false-positive は Cargo.toml の [package.metadata.cargo-machete] ignored で除外
      - uses: bnjbvr/cargo-machete@main

  stub-guard:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Stub / mock / dbg guard (grep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # (2026-09-03 refine):
      # 仮実装 rule では todo!() / unimplemented!() は legitimate な
      # fail-fast idiom として endorse されている → block しない、warn only
      # → block 対象は panic!(STUB) (explicit STUB marker) と dbg!() のみ
      # → comment 行 (^\s*//) は除外して source code のみ検知
      - name: Block panic!(STUB) in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'panic!\([^)]*STUB' \
            src/ --include="*.rs" \
            --exclude-dir=bin \
            | grep -v ':[[:space:]]*//' \
            | grep -vE ':[[:space:]]*/\*' \
            || true)
          if [ -n "$hits" ]; then
            echo "❌ Explicit STUB panic detected in src/ (production path):"
            echo "$hits"
            exit 1
          fi
          echo "✓ No panic!(STUB) in src/"

      - name: Detect todo! / unimplemented! (informational, not blocking)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'todo!\(|unimplemented!\(' \
            src/ --include="*.rs" \
            --exclude-dir=bin \
            | grep -v ':[[:space:]]*//' \
            | grep -vE ':[[:space:]]*/\*' \
            || true)
          if [ -n "$hits" ]; then
            count=$(echo "$hits" | wc -l | tr -d ' ')
            echo "::warning::${count} todo!()/unimplemented!() marker(s) in src/ (informational, legitimate fail-fast idiom):"
            echo "$hits" | head -20
          else
            echo "✓ No todo!/unimplemented! markers in src/"
          fi

      - name: Detect dbg!() residual in src/**
        run: |
          set -eo pipefail
          hits=$(grep -rn 'dbg!(' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "❌ dbg!() macro left in src/:"
            echo "$hits"
            exit 1
          fi
          echo "✓ No dbg!() in src/"

      - name: Detect TODO / FIXME / XXX / HACK (informational)
        run: |
          set -eo pipefail
          hits=$(grep -rnE 'TODO|FIXME|XXX|HACK' src/ --include="*.rs" || true)
          if [ -n "$hits" ]; then
            echo "::warning::TODO/FIXME/XXX/HACK found in src/ (informational, not blocking):"
            echo "$hits" | head -50
          else
            echo "✓ No TODO/FIXME/XXX/HACK in src/"
          fi

  package-integrity:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Package integrity (publish される .crate が build できるか)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # publish される .crate に必要な file が全部入っているかを見る
      #
      # include_str! / include_bytes! が package 境界を越える、exclude を効かせ過ぎる、
      # 必要 file が漏れる — これらは repo / workspace に file がある限り
      # cargo build も cargo test も clippy も preflight も全部通り、
      # crates.io から取得した利用者だけが compile 不能になる
      # (2026-09-28 ALICE-LOL lol.gbnf)
      #
      # semver-checks は baseline を build するので結果的に検出するが、
      # (a) 壊れた版を publish した後にしか分からない
      # (b) 未 publish crate は baseline が無く発火しない ので予防にならない
      - name: cargo package (.crate を作る)
        # --no-verify: 未 publish の sibling に path dep がある repo では verify step が
        #   registry 解決で落ちる 展開後の隔離 build が本体なので verify は不要
        run: cargo package --no-verify --allow-dirty

      - name: 展開して隔離 build
        run: |
          set -euo pipefail
          crate=$(find target/package -maxdepth 1 -name '*.crate' | head -1)
          [ -n "$crate" ] || { echo "::error::.crate が生成されていない"; exit 1; }
          echo "packaged: $(basename "$crate") ($(du -h "$crate" | cut -f1))"
          tmp=$(mktemp -d)
          tar xzf "$crate" -C "$tmp"
          cd "$tmp"/*/
          # 親 workspace を継承すると member 扱いになり、境界を越えた file が
          # 再び見えてしまう (検査の意味が消える) ので単独 package として build
          printf '\n[workspace]\n' >> Cargo.toml
          cargo check --all-features

  coverage:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Coverage (cargo-llvm-cov、informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: |
          cargo llvm-cov --lib --summary-only 2>&1 | tee coverage-summary.txt

      - name: Upload coverage summary as artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 30

  semver-checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: cargo-semver-checks (API compat、informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ALICE-Cache は publish = false (crates.io publish 想定なし) だが
    # sibling path dep が crates.io に無く baseline 取得不能なため
    # git baseline (HEAD~1) で比較、informational only
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # baseline-rev 比較のため full history 必要
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # version 明示 pin: `@latest` は rustc MSRV を追いかける (0.50.0 = 1.93+) ので、
      # rust-toolchain.toml の pin が遅れると赤になる (2026-09-14 事案) toolchain と
      # 一緒に月次で bump する
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0

      # sibling path dep のため --baseline-rev で git 経由の比較
      # main の直前 commit と比較 (informational、break あっても block しない)
      - name: Run cargo semver-checks
        run: |
          cargo semver-checks check-release \
            --package alice-cache \
            --baseline-rev "HEAD~1" \
            || true

  gate:
    name: Gate
    if: always()
    needs: [changes, audit, deny, unused-deps, stub-guard, package-integrity, coverage, semver-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed_paths.py gate --needs-json "$NEEDS"
