name: 'ALICE-Cache Optional Bridge Stubs'
description: |
  Create empty stub crates for the ALICE-Cache sibling path deps
  (alice-crypto / alice-analytics) so that ALICE-Cache can resolve its
  workspace-relative optional path deps in CI.
  These crates are private to the local ALICE Eco-System and not on crates.io.

  Canonical CI template: [[reference_alice_ci_canonical_template]]

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # alice-crypto stub (optional feature "crypto")
        # ALICE-Cache は default-features = false, features = ["std"] で参照する
        # ため、stub には最低限 [features] std = [] が必要
        mkdir -p "../ALICE-Crypto/src"
        cat > "../ALICE-Crypto/Cargo.toml" <<'TOML'
        [package]
        name = "alice-crypto"
        version = "0.1.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        std = []

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-Crypto/src/lib.rs"

        # alice-analytics stub (optional feature "analytics")
        # ALICE-Cache は default-features = false, features = ["std"] で参照する
        # ため、[features] default = ["std"] と std = [] が必要
        mkdir -p "../ALICE-Analytics/src"
        cat > "../ALICE-Analytics/Cargo.toml" <<'TOML'
        [package]
        name = "alice-analytics"
        version = "0.1.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [features]
        default = ["std"]
        std = []

        [lib]
        path = "src/lib.rs"
        TOML
        : > "../ALICE-Analytics/src/lib.rs"

        echo "Created stubs: alice-crypto / alice-analytics (all with license = MIT OR Apache-2.0)"
