[package]
name = "alice-cache"
version = "0.2.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "Predictive Distributed Caching System - Inferno Edition"
license = "AGPL-3.0"
repository = "https://github.com/ext-sakamoro/ALICE-Cache"

[lib]
name = "alice_cache"
crate-type = ["rlib", "cdylib"]

[features]
default = ["std"]
std = []
pyo3 = ["dep:pyo3", "dep:numpy", "std"]  # Python bindings
crypto = ["dep:alice-crypto", "std"]  # Signed cache entries for tamper prevention
analytics = ["dep:alice-analytics", "std"]  # Cache hit/miss metrics + hot key tracking

[dependencies]
parking_lot = "0.12"
hashbrown = "0.14"
ahash = "0.8"
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
numpy = { version = "0.27", optional = true }
alice-crypto = { path = "../ALICE-Crypto", optional = true, default-features = false, features = ["std"] }
alice-analytics = { path = "../ALICE-Analytics", optional = true, default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "cache_bench"
harness = false

[[example]]
name = "basic_cache"

[[example]]
name = "distributed_cache"
