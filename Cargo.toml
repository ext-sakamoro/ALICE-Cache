[package]
name = "alice-cache"
version = "0.2.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "Predictive Distributed Caching System - Inferno Edition"
license = "AGPL-3.0"
repository = "https://github.com/ext-sakamoro/ALICE-Cache"

[features]
default = ["std"]
std = []

[dependencies]
parking_lot = "0.12"
hashbrown = "0.14"
ahash = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "cache_bench"
harness = false

[[example]]
name = "basic_cache"

[[example]]
name = "distributed_cache"
