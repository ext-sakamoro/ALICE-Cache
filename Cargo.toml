[package]
name = "alice-cache"
version = "0.2.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "Predictive Distributed Caching System — SDF-gradient locality + probabilistic hit/miss forecasting"
license = "LicenseRef-Proprietary"
publish = false
repository = "https://github.com/ext-sakamoro/ALICE-Cache"
keywords = ["cache", "distributed", "predictive", "sdf", "no_std"]
categories = ["caching", "concurrency", "no-std"]

[lib]
name = "alice_cache"
crate-type = ["rlib", "cdylib"]

[features]
default = ["std"]
# std: parking_lot Mutex (OS futex) no_std は spin::Mutex ハッシュは std / no_std とも固定 seed (src/seed.rs)
# (2026-09-15 まで parking_lot が非 optional で bare-metal では std 要求 = no_std claim が dep レベルで偽だった)
std = ["dep:parking_lot"]
pyo3 = ["dep:pyo3", "dep:numpy", "std"]  # Python bindings
crypto = ["dep:alice-crypto", "std"]  # Signed cache entries for tamper prevention
# analytics feature は無効のまま: src/analytics_bridge.rs が使う HyperLogLog / DDSketch /
# CountMinSketch を alice-analytics の main は公開していない (戻す時は git branch=main で依存を足す)

[dependencies]
# no_std で 64-bit atomic の無い target (Cortex-M4 thumbv7em = 32-bit atomic まで) でも
# AtomicU64 を提供 (native があればそのまま、無ければ seqlock fallback) 2026-09-17
portable-atomic = { version = "1", default-features = false, features = ["fallback"] }
parking_lot = { version = "0.12", optional = true }
# no_std 用 Mutex (std 時は parking_lot、shard.rs で cfg 切替)
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
hashbrown = { version = "0.14", default-features = false, features = ["inline-more"] }
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
numpy = { version = "0.27", optional = true }
alice-crypto = { git = "https://github.com/ext-sakamoro/ALICE-Crypto", branch = "main", version = "0.7", optional = true, default-features = false, features = ["std-base", "hash", "aead"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "cache_bench"
harness = false

[[example]]
name = "basic_cache"

[[example]]
name = "distributed_cache"
