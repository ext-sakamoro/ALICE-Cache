[package]
name = "alice-cache"
version = "0.2.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Predictive Distributed Caching System — SDF-gradient locality + probabilistic hit/miss forecasting"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ext-sakamoro/ALICE-Cache"
keywords = ["cache", "distributed", "predictive", "sdf", "no_std"]
categories = ["caching", "concurrency", "no-std"]

[lib]
name = "alice_cache"
crate-type = ["rlib", "cdylib"]

[features]
default = ["std"]
# std: parking_lot Mutex (OS futex) + ahash runtime RNG no_std は spin::Mutex + compile-time RNG
# (2026-09-15 まで parking_lot が非 optional で bare-metal では std 要求 = no_std claim が dep レベルで偽だった)
std = ["dep:parking_lot", "ahash/std", "ahash/runtime-rng"]
pyo3 = ["dep:pyo3", "dep:numpy", "std"]  # Python bindings
crypto = ["dep:alice-crypto", "std"]  # Signed cache entries for tamper prevention
# analytics feature は alice-analytics 側 API drift で 0.2.0 では一時 disable
# HyperLogLog/DDSketch/CountMinSketch は alice-analytics 側で rename or 未 export
# 修正後 0.3.0 で復活予定 (下記 optional dep は保持、feature gate off)
# analytics = ["dep:alice-analytics", "std"]

[dependencies]
parking_lot = { version = "0.12", optional = true }
# no_std 用 Mutex (std 時は parking_lot、shard.rs で cfg 切替)
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
hashbrown = "0.14"
ahash = { version = "0.8", default-features = false, features = ["compile-time-rng"] }
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
numpy = { version = "0.27", optional = true }
alice-crypto = { version = "0.1", optional = true, default-features = false, features = ["std"] }
alice-analytics = { version = "0.1", optional = true, default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "cache_bench"
harness = false

[[example]]
name = "basic_cache"

[[example]]
name = "distributed_cache"
